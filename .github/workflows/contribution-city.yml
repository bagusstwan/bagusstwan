name: Update Contribution City

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - generate_city.py

permissions:
  contents: write

concurrency:
  group: contribution-city
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVG and interactive page
        run: python generate_city.py bagusstwan assets/contribution-city.svg docs/index.html
      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-city.svg docs/index.html
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore: update contribution city"
            git push
          fi
